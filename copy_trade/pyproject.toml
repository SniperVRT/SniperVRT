[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copy-trade-engine"
version = "0.1.0"
description = "Copy-trade meta-allocator: score masters on Sharpe/Calmar, allocate capital programmatically via Bitget."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "apscheduler>=3.10",
    "structlog>=24.1",
    "rich>=13.7",
    "typer>=0.12",
    "eth-account>=0.13",
    "hyperliquid-python-sdk>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
]

[project.scripts]
copy-trade = "copy_trade.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["copy_trade*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

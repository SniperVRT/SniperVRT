[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi-engine"
version = "0.1.0"
description = "Modular probability mispricing engine for Kalshi event markets."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "apscheduler>=3.10",
    "cryptography>=42",
    "structlog>=24.1",
    "rich>=13.7",
    "pandas>=2.2",
    "streamlit>=1.34",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
]

[project.scripts]
kalshi-engine = "kalshi_engine.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["kalshi_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
